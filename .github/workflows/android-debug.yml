name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "www/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Validate web bundle
        run: |
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css
          node --check www/app.js
          ! grep -q "Arranque Android OK" www/index.html
          ! grep -q "Cargando aplicación" www/index.html
      - name: Bundle Supabase SDK locally
        run: |
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          sed -i '/<script src="app.js"><\/script>/i <script src="supabase.js"></script>' www/index.html
          test -s www/supabase.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add Rider Voz Android permissions
        run: |
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rider-voz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
