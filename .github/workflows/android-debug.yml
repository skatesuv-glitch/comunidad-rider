name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, comunidad-v1-aprobada]
  pull_request:
    branches: [main]
    paths:
      - "www/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Bundle Leaflet locally
        run: |
          mkdir -p www/vendor
          cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet.css
      - name: Restore approved Community Rider image
        run: |
          cat www/assets/community_cover_*.part | tr -d '\n\r ' | base64 -d > www/assets/community-approved.png
          test -s www/assets/community-approved.png
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: comunidad-rider-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
