name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, rider-voice-clean-rebuild, rider-voz-blindada-287, rider-voz-trabajo-297]
  pull_request:
    branches: [main, rider-voice-clean-rebuild]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Check approved UI and command behavior
        run: |
          python3 scripts/build_web.py
          node --check www/app.js
          node --test tests/commands.test.js
          python3 tests/verify_base.py
          python3 tests/verify_radio_native.py
          python3 tests/verify_radio_policy.py
      - run: npx cap add android && npx cap sync android
      - name: Install offline command engine
        run: |
          curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -o /tmp/rider-model.zip
          echo '09b239888f633ef2f0b4e09736e3d9936acfd810bc65d53fad45261762c6511f  /tmp/rider-model.zip' | sha256sum -c -
          unzip -q /tmp/rider-model.zip -d /tmp
          python3 scripts/prepare_android.py /tmp/vosk-model-small-es-0.42
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rider-voz-trabajo-297
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Export apksigner tool
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p /tmp/rider-apksigner/lib
          cp "$BT/apksigner" /tmp/rider-apksigner/apksigner
          cp "$BT/lib/apksigner.jar" /tmp/rider-apksigner/lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: rider-apksigner-tool
          path: /tmp/rider-apksigner
          if-no-files-found: error
