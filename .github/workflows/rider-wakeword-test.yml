name: Rider wake-word test APK

on:
  push:
    branches: [ rider-voz-stable-rebuild ]
    paths:
      - 'wakeword-test/**'
      - '.github/workflows/rider-wakeword-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download official sherpa Android AAR
        working-directory: wakeword-test
        run: |
          set -euxo pipefail
          mkdir -p app/libs
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar -O app/libs/sherpa-onnx-1.13.8.aar

      - name: Download official English KWS model
        working-directory: wakeword-test
        run: |
          set -euxo pipefail
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          URL=https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/$MODEL.tar.bz2
          wget -q "$URL" -O model.tar.bz2
          tar -xjf model.tar.bz2
          mkdir -p app/src/main/assets/rider-kws
          mv "$MODEL" app/src/main/assets/rider-kws/

      - name: Generate RIDER keyword tokens
        working-directory: wakeword-test
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet sherpa-onnx==1.13.8 sentencepiece pypinyin
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          DIR=app/src/main/assets/rider-kws/$MODEL
          sherpa-onnx-cli text2token \
            --tokens "$DIR/tokens.txt" \
            --tokens-type bpe \
            --bpe-model "$DIR/bpe.model" \
            keywords_raw.txt "$DIR/rider-keyword.txt"
          echo "Keyword file:"
          cat "$DIR/rider-keyword.txt"

      - name: Strip unused model files
        working-directory: wakeword-test
        run: |
          set -euxo pipefail
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          DIR=app/src/main/assets/rider-kws/$MODEL
          rm -f "$DIR/encoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          rm -f "$DIR/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          rm -f "$DIR/joiner-epoch-12-avg-2-chunk-16-left-64.onnx"
          rm -f "$DIR/bpe.model" "$DIR/configuration.json"
          rm -f "$DIR/README.md" "$DIR/keywords.txt" "$DIR/keywords_raw.txt"
          rm -rf "$DIR/test_wavs"
          find "$DIR" -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Build APK
        working-directory: wakeword-test
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Rider-WakeWord-Test-GigaSpeech
          path: wakeword-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
