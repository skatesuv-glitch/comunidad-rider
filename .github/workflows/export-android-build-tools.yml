name: Export Android build tools

on:
  push:
    branches: [ rider-voz-stable-rebuild ]
    paths:
      - '.github/workflows/export-android-build-tools.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export official Android build tools
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          mkdir -p out
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" out/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" out/
          chmod +x out/zipalign out/apksigner
          ./out/apksigner --version
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: out/*
          if-no-files-found: error
