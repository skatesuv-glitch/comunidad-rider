<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b12">
<title>eSkate SUV Comunidad</title>
<style>
html,body{margin:0;min-height:100%;background:#03070c;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#bootcheck{padding:32px 20px;max-width:430px;margin:auto}
#bootcheck b{display:block;color:#20d9ff;letter-spacing:.12em;margin-bottom:18px}
#bootcheck h1{font-size:28px;margin:0 0 10px}
#bootcheck p{color:#9bb0bd;line-height:1.45}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="bootcheck"><b>eSKATE SUV · COMUNIDAD</b><h1>Arranque Android OK</h1><p id="bootmsg">Cargando aplicación…</p></div>
<main id="app"></main>
<script>
window.addEventListener('error',function(e){var m=document.getElementById('bootmsg');if(m)m.textContent='ERROR JS: '+(e.message||'desconocido')+' · línea '+(e.lineno||'?');});
window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('bootmsg');if(m)m.textContent='ERROR PROMESA: '+String(e.reason||'desconocido');});
</script>
<script src="app.js"></script>
</body></html>
